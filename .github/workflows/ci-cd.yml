# CI/CD pipeline skeleton (issue #31). Brief §3: every change to main triggers
#   (a) SBOM, (b) SAST + SCA + secret scan, (c) build + container build, (d) image signing,
#   (e) quality gate, then deployment to Kubernetes via the container registry (GHCR).
#
# Job graph (an arrow is a `needs:`; a failed job stops everything behind it):
#
#   context ─────────────────────────────────────────────┐  (is this a release run? see below)
#   meta ─┬─ test-backend ──┐                            │
#         ├─ test-frontend ─┤                            ▼
#         └─ sbom ─┬─ sast ─┤
#                  ├─ sca ──┼─ build (frontend, backend) ─ sign ─ quality-gate ─ deploy ─ evidence
#                  └─ secrets ┘
#
# A *release run* is a push to main or a manual run on main (`context` job, output `release`).
# Build, sign, gate, deploy and evidence run only then: no signing, no registry write and no
# deployment from a pull request or from a manual run on another branch. One expression, one
# place: every release job asks `needs.context.outputs.release == 'true'`.
#
# Pull requests and manual runs on other branches run meta, the tests, the SBOM and the scans.
#
# The stage jobs are stubs that name the issue that fills them in. Each stub already carries the
# permissions its final version needs, so the least-privilege layout is reviewed once, here.
#
# Rules for every change to this file (SR-06, SR-07; checked by scripts/check-pinning.sh and
# `make lint-actions`):
#   - every third-party action is pinned by its full commit SHA, with the version in a comment;
#   - `permissions` start at none; a job asks only for what it uses;
#   - no untrusted input (branch name, PR title, ...) goes into a `run:` line; pass it via `env:`.

name: ci-cd

on:
  push:
    branches: [main]
    # `evidence/**` is only a safety net: the evidence job publishes to the `evidence` branch (#44),
    # which does not trigger this workflow. Nothing else is ignored, so every other change to main
    # (also documentation) triggers a run (brief §3).
    paths-ignore: ["evidence/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One group per commit, so every push to main gets its own run and its own evidence. (A group per
# branch would keep only one running and one waiting run and cancel the older waiting one.) A newer
# push to a pull request cancels the older scan of that pull request. Deployments are serialised
# separately, by the concurrency of the deploy job.
concurrency:
  group: ci-cd-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------------------------
  # context: is this a release run (push or manual run on main, never a pull request)? Computed
  # once and reused by every job that builds, signs, deploys or writes evidence. No checkout, no
  # permissions, nothing that can fail.
  # ---------------------------------------------------------------------------------------------
  context:
    name: context
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Decide whether this is a release run
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          release=false
          if [[ "$EVENT" != "pull_request" && "$REF" == "refs/heads/main" ]]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Release run: $release (event $EVENT, ref $REF)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  # meta: pinning check and the version that every later job uses (VERSION.txt, brief §7a).
  # ---------------------------------------------------------------------------------------------
  meta:
    name: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      tag_version: ${{ steps.version.outputs.tag_version }}
      tag_sha: ${{ steps.version.outputs.tag_sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SR-06: actions pinned by SHA, base images by digest. Fails on any mutable reference.
      - name: Check that actions and images are pinned
        run: scripts/check-pinning.sh

      - name: Read the version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION.txt)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION.txt is not a SemVer version: '$version'" >&2
            exit 1
          fi
          short_sha="${GITHUB_SHA::7}"
          {
            echo "version=$version"
            echo "short_sha=$short_sha"
            echo "tag_version=$version"
            echo "tag_sha=$version-$short_sha"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, commit $short_sha" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  # Unit tests and linters of both components (before anything is built).
  # ---------------------------------------------------------------------------------------------
  test-backend:
    name: test (backend)
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version

      # The version range is enforced by `required-version` in backend/pyproject.toml (ADR-002).
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: false

      - name: Lint
        run: make -C backend lint

      # Throwaway PostgreSQL from compose.yaml with the real migrations, then the full suite.
      - name: Test against PostgreSQL
        run: make test-db

  test-frontend:
    name: test (frontend)
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      # Installs exactly package-lock.json; install scripts of dependencies do not run.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------------------------
  # (a) SBOM and (b) scans, all through scripts/scan.sh so every report can be reproduced with
  # Docker on a laptop. The scans report findings and succeed; the quality gate (#36) decides what
  # blocks. SBOM and Trivy of the built images follow with #34 and #35.
  # ---------------------------------------------------------------------------------------------
  sbom:
    name: sbom
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      components: ${{ steps.sbom.outputs.components }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CycloneDX per component (Syft), validated with the CycloneDX CLI. #32
      - name: Generate and validate the SBOMs
        id: sbom
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SHORT_SHA: ${{ needs.meta.outputs.short_sha }}
        run: scripts/scan.sh sbom

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: reports/sbom/
          if-no-files-found: error
          retention-days: 90

  sast:
    name: scan (SAST)
    needs: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.semgrep.outputs.findings }} # severity ERROR, counted by the quality gate (#36)
      findings_all: ${{ steps.semgrep.outputs.findings_all }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Semgrep with the registry packs and our own rules in .semgrep/. #33
      - name: Semgrep
        id: semgrep
        run: scripts/scan.sh sast

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sast
          path: reports/sast/
          if-no-files-found: error
          retention-days: 90

  sca:
    name: scan (SCA)
    needs: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.trivy.outputs.findings }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trivy on the lockfiles: full report, the gate counts HIGH and CRITICAL. #33
      - name: Trivy (lockfiles)
        id: trivy
        run: scripts/scan.sh sca

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sca
          path: reports/sca/
          if-no-files-found: error
          retention-days: 90

  secrets:
    name: scan (secrets)
    needs: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.gitleaks.outputs.findings }}
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Gitleaks over the full history with .gitleaks.toml; values are redacted in the report. #33
      - name: Gitleaks
        id: gitleaks
        run: scripts/scan.sh secrets

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secrets
          path: reports/secrets/
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------------------------
  # (c) Build and container build, push to GHCR, record the digest (#34). Not on pull requests.
  # scripts/build-image.sh does the work, so the same command builds an image on a laptop (against
  # any registry, see its header). Everything downstream uses the digest, never a tag.
  # ---------------------------------------------------------------------------------------------
  build:
    name: build (${{ matrix.image }})
    needs: [context, meta, test-backend, test-frontend, sast, sca, secrets]
    if: needs.context.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # packages: write is the only write permission of the image push (#34).
    permissions:
      contents: read
      packages: write  # push the image to GHCR (#34)
    # One output per image (a matrix leg sets only its own), digest as `sha256:...`.
    outputs:
      frontend: ${{ steps.build.outputs.frontend }}
      backend: ${{ steps.build.outputs.backend }}
    strategy:
      fail-fast: true
      matrix:
        image: [frontend, backend]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tags <VERSION> and <VERSION>-<shortsha>, never `latest`; provenance mode=max;
      # SOURCE_DATE_EPOCH and timestamp rewriting; fails if the pushed image carries the local
      # default label 0.0.0-dev. The token reaches the script only through the environment.
      - name: Build, push and record the digest
        id: build
        env:
          IMAGE: ${{ matrix.image }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/build-image.sh "$IMAGE"

      # digest.txt and image-ref.txt (the reference by digest) per image, as the brief's
      # submission asks; the evidence job (#44) copies them.
      - name: Upload digest and image reference
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image }}
          path: reports/images/${{ matrix.image }}/
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------------------------
  # (d) Image signing with cosign (#35), key-based: the private key is the secret COSIGN_PRIVATE_KEY
  # and reaches only the signing step, as an environment variable. The step after it verifies
  # signature and SBOM attestation with the committed public key (infrastructure/signing/
  # cosign.pub) and the reports go to the artifact `signing-<image>` (evidence, #44). The image is
  # always addressed by its digest from the build job. Not on pull requests.
  # ---------------------------------------------------------------------------------------------
  sign:
    name: sign (${{ matrix.image }})
    needs: [context, meta, sbom, build]
    if: needs.context.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The signing key is an environment secret of `signing`, which only the branch `main` may use
    # (scripts/setup-signing-key.sh creates it): no other branch or workflow can read the key.
    environment: signing
    # packages: write attaches signature and attestation to the image in GHCR (#35).
    permissions:
      contents: read
      packages: write  # attach signature and attestation to the image (#35)
    strategy:
      fail-fast: true
      matrix:
        image: [frontend, backend]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the digest of this image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.image }}
          path: reports-in/image-${{ matrix.image }}

      - name: Download the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: reports-in/sbom

      # The scripts read reports/images/<image>/ and reports/sbom/ (same layout as on a laptop).
      - name: Place the reports
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p "reports/images" "reports/sbom"
          cp -r "reports-in/image-$IMAGE" "reports/images/$IMAGE"
          cp reports-in/sbom/* reports/sbom/

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin

      - name: Sign the image and attest its SBOM
        env:
          IMAGE: ${{ matrix.image }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: scripts/sign-image.sh "$IMAGE"

      # No secret in this step: only the public key in the repository is needed.
      - name: Verify signature and attestation
        env:
          IMAGE: ${{ matrix.image }}
        run: scripts/verify-image.sh "$IMAGE"

      - name: Upload the signing reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-${{ matrix.image }}
          path: reports/signing/${{ matrix.image }}/
          if-no-files-found: warn
          retention-days: 90

  # ---------------------------------------------------------------------------------------------
  # (e) Quality gate (brief §3e, #36): fails on a secret, on a HIGH/CRITICAL or CVSS >= 7.0 finding
  # and on a missing or invalid signature. Runs scripts/quality_gate.py on the reports of this run;
  # the deploy job needs it. It runs also when a scan job failed (`!cancelled()`), because the
  # script treats a job that did not succeed as a violation and the blocked run is evidence too.
  # ---------------------------------------------------------------------------------------------
  quality-gate:
    name: quality gate
    needs: [context, meta, sast, sca, secrets, build, sign]
    if: ${{ !cancelled() && needs.context.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read  # pull the images to scan and verify them (#36)
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A missing artifact is not an error here: the gate reports it as a violation.
      - name: Download the reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          path: reports-in

      - name: Place the reports
        run: |
          mkdir -p reports/images reports/sbom reports/sast reports/sca reports/secrets
          for image in frontend backend; do
            if [[ -d "reports-in/image-$image" ]]; then cp -r "reports-in/image-$image" "reports/images/$image"; fi
          done
          for kind in sbom sast sca secrets; do
            if [[ -d "reports-in/$kind" ]]; then cp -r "reports-in/$kind/." "reports/$kind/"; fi
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin

      # Trivy on the pushed images, by digest. A failed scan leaves no report, which the gate
      # counts as a violation.
      - name: Scan the images (Trivy)
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Trivy (images)"
            echo "| Image | Vulnerabilities (all) | HIGH or CRITICAL |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for image in frontend backend; do
            scripts/scan.sh image "$image" || echo "::warning::image scan of $image failed"
          done

      - name: Evaluate the reports and verify the signatures
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" > reports/needs.json
          python3 scripts/quality_gate.py --needs reports/needs.json | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Upload the gate reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate
          path: reports/gate/
          if-no-files-found: warn
          retention-days: 90

  # ---------------------------------------------------------------------------------------------
  deploy:
    name: deploy
    needs: [context, meta, quality-gate]
    if: needs.context.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One deployment at a time. A deploy that is still waiting is replaced by a newer one, which is
    # fine: the newer commit contains the older one. Every run keeps its own evidence.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read  # pull the verified images (#43)
    steps:
      - name: Deploy to kind
        run: 'echo "stub: verify again, create the kind cluster and apply the manifests in #43"'

  # ---------------------------------------------------------------------------------------------
  # Evidence of every run (#44): run log, SAST, SBOM, SCA, secrets and signing reports, sorted into
  # evidence/<image>/<type>/<run>-<sha>-<file> by scripts/collect-evidence.sh.
  # Runs also when an earlier job failed (even `meta`), because a blocked run is evidence too, but
  # not when the run was cancelled by hand. The reports go to the `evidence` branch, not to main:
  # the ruleset of main requires a reviewed pull request and has no bypass (deviations.md, D-09).
  # The artifacts `signing` (#35) and `gate` (#36) are picked up as soon as those jobs upload them.
  # ---------------------------------------------------------------------------------------------
  evidence:
    name: evidence
    needs: [context, meta, sbom, sast, sca, secrets, build, sign, quality-gate, deploy]
    if: ${{ !cancelled() && needs.context.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One evidence job at a time; they only add files, so a waiting one is never dropped.
    concurrency:
      group: evidence
      cancel-in-progress: false
    permissions:
      contents: write  # push the evidence branch (#44)
      actions: read  # download the artifacts and the job logs of this run
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A run that stopped early has fewer artifacts; that is fine, so no artifact is required.
      - name: Download the artifacts of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          path: artifacts

      - name: Collect the reports of this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SHORT_SHA: ${{ needs.meta.outputs.short_sha }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          mkdir -p artifacts/run-logs artifacts/gate
          # Result of every job of this run, written by the pipeline itself.
          echo "$NEEDS" > artifacts/run-logs/job-results.json
          scripts/fetch-run-logs.sh "$REPO" "$RUN_ID" artifacts/run-logs
          sha="${SHORT_SHA:-${GITHUB_SHA::7}}"
          scripts/collect-evidence.sh artifacts evidence-out "$(printf '%05d' "$RUN_NUMBER")-$sha"

      - name: Publish to the evidence branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: scripts/publish-evidence.sh "$REPO" evidence-out "evidence run $RUN_NUMBER"
