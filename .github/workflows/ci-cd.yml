# CI/CD pipeline skeleton (issue #31). Brief §3: every change to main triggers
#   (a) SBOM, (b) SAST + SCA + secret scan, (c) build + container build, (d) image signing,
#   (e) quality gate, then deployment to Kubernetes via the container registry (GHCR).
#
# Job graph (an arrow is a `needs:`; a failed job stops everything behind it):
#
#   meta ─┬─ test-backend ──┐
#         ├─ test-frontend ─┤
#         └─ sbom ─┬─ sast ─┤
#                  ├─ sca ──┼─ build (frontend, backend) ─ sign ─ quality-gate ─ deploy ─ evidence
#                  └─ secrets ┘
#
# Pull requests run only meta, the tests, the SBOM and the three scans. Build, sign, gate, deploy
# and evidence run on pushes to main (and manual runs) only: no signing, no registry write and no
# deployment from a pull request.
#
# The stage jobs are stubs that name the issue that fills them in. Each stub already carries the
# permissions its final version needs, so the least-privilege layout is reviewed once, here.
#
# Rules for every change to this file (SR-06, SR-07; checked by scripts/check-pinning.sh and
# `make lint-actions`):
#   - every third-party action is pinned by its full commit SHA, with the version in a comment;
#   - `permissions` start at none; a job asks only for what it uses;
#   - no untrusted input (branch name, PR title, ...) goes into a `run:` line; pass it via `env:`.

name: ci-cd

on:
  push:
    branches: [main]
    # The evidence job commits reports back (#44); ignoring them avoids a loop. Docs-only changes
    # build nothing.
    paths-ignore: ["evidence/**", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["evidence/**", "docs/**"]
  workflow_dispatch:

permissions: {}

# One run per ref at a time: a deployment is never overtaken by a newer run of the same branch.
# Newer pull request pushes cancel the older scan; runs on main are never cancelled.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------------------------
  # meta: pinning check and the version that every later job uses (VERSION.txt, brief §7a).
  # ---------------------------------------------------------------------------------------------
  meta:
    name: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      tag_version: ${{ steps.version.outputs.tag_version }}
      tag_sha: ${{ steps.version.outputs.tag_sha }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SR-06: actions pinned by SHA, base images by digest. Fails on any mutable reference.
      - name: Check that actions and images are pinned
        run: scripts/check-pinning.sh

      - name: Read the version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION.txt)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION.txt is not a SemVer version: '$version'" >&2
            exit 1
          fi
          short_sha="${GITHUB_SHA::7}"
          {
            echo "version=$version"
            echo "short_sha=$short_sha"
            echo "tag_version=$version"
            echo "tag_sha=$version-$short_sha"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version, commit $short_sha" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------
  # Unit tests and linters of both components (before anything is built).
  # ---------------------------------------------------------------------------------------------
  test-backend:
    name: test (backend)
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version

      # The version range is enforced by `required-version` in backend/pyproject.toml (ADR-002).
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: false

      - name: Lint
        run: make -C backend lint

      # Throwaway PostgreSQL from compose.yaml with the real migrations, then the full suite.
      - name: Test against PostgreSQL
        run: make test-db

  test-frontend:
    name: test (frontend)
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      # Installs exactly package-lock.json; install scripts of dependencies do not run.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------------------------
  # (a) SBOM and (b) scans, all through scripts/scan.sh so every report can be reproduced with
  # Docker on a laptop. The scans report findings and succeed; the quality gate (#36) decides what
  # blocks. SBOM and Trivy of the built images follow with #34 and #35.
  # ---------------------------------------------------------------------------------------------
  sbom:
    name: sbom
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      components: ${{ steps.sbom.outputs.components }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # CycloneDX per component (Syft), validated with the CycloneDX CLI. #32
      - name: Generate and validate the SBOMs
        id: sbom
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          SHORT_SHA: ${{ needs.meta.outputs.short_sha }}
        run: scripts/scan.sh sbom

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: reports/sbom/
          if-no-files-found: error
          retention-days: 90

  sast:
    name: scan (SAST)
    needs: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # SARIF upload to code scanning, only when the repository has it (#33)
    outputs:
      findings: ${{ steps.semgrep.outputs.findings }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Semgrep with the registry packs and our own rules in .semgrep/. #33
      - name: Semgrep
        id: semgrep
        run: scripts/scan.sh sast

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sast
          path: reports/sast/
          if-no-files-found: error
          retention-days: 90

      # Code scanning needs GitHub Code Security, which a private repository on a personal plan
      # does not have. Set the repository variable CODE_SCANNING to "true" when it is available
      # (public repository or an upgraded plan). Until then the SARIF files stay in the artifact.
      - name: Upload the frontend SARIF to code scanning
        if: ${{ !cancelled() && github.event_name == 'push' && vars.CODE_SCANNING == 'true' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/sast/semgrep-frontend.sarif
          category: semgrep-frontend

      - name: Upload the backend SARIF to code scanning
        if: ${{ !cancelled() && github.event_name == 'push' && vars.CODE_SCANNING == 'true' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/sast/semgrep-backend.sarif
          category: semgrep-backend

  sca:
    name: scan (SCA)
    needs: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.trivy.outputs.findings }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trivy on the lockfiles: full report, the gate counts HIGH and CRITICAL. #33
      - name: Trivy (lockfiles)
        id: trivy
        run: scripts/scan.sh sca

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sca
          path: reports/sca/
          if-no-files-found: error
          retention-days: 90

  secrets:
    name: scan (secrets)
    needs: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      findings: ${{ steps.gitleaks.outputs.findings }}
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Gitleaks over the full history with .gitleaks.toml; values are redacted in the report. #33
      - name: Gitleaks
        id: gitleaks
        run: scripts/scan.sh secrets

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secrets
          path: reports/secrets/
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------------------------
  # (c) Build and container build. Not on pull requests.
  # ---------------------------------------------------------------------------------------------
  build:
    name: build (${{ matrix.image }})
    needs: [meta, test-backend, test-frontend, sast, sca, secrets]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # packages: write is the only write permission of the image push (#34).
    permissions:
      contents: read
      packages: write  # push the image to GHCR (#34)
    strategy:
      fail-fast: true
      matrix:
        image: [frontend, backend]
    steps:
      - name: Build and push the image
        env:
          IMAGE: ${{ matrix.image }}
          TAG: ${{ needs.meta.outputs.tag_sha }}
        run: 'echo "stub: build ghcr.io/jankrus/doctorholiday-$IMAGE:$TAG and push it in #34"'

  # ---------------------------------------------------------------------------------------------
  # (d) Image signing with cosign. Not on pull requests.
  # ---------------------------------------------------------------------------------------------
  sign:
    name: sign (${{ matrix.image }})
    needs: [meta, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # packages: write attaches signature and attestation to the image in GHCR (#35).
    permissions:
      contents: read
      packages: write  # attach signature and attestation to the image (#35)
    strategy:
      fail-fast: true
      matrix:
        image: [frontend, backend]
    steps:
      - name: Sign the image digest with cosign
        env:
          IMAGE: ${{ matrix.image }}
        run: 'echo "stub: sign doctorholiday-$IMAGE by digest and attach the SBOM attestation in #35"'

  # ---------------------------------------------------------------------------------------------
  # (e) Quality gate (brief §3e): fails on a secret, on CVSS >= 7.0 and on a missing or invalid
  # signature. Implemented in #36. The deploy job depends on it.
  # ---------------------------------------------------------------------------------------------
  quality-gate:
    name: quality gate
    needs: [meta, sast, sca, secrets, sign]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read  # pull the images to verify their signatures (#36)
    steps:
      - name: Evaluate the reports and verify the signatures
        run: 'echo "stub: scripts/quality-gate.sh is implemented in #36"'

  # ---------------------------------------------------------------------------------------------
  # Deployment of the verified digests to a kind cluster (#43).
  # ---------------------------------------------------------------------------------------------
  deploy:
    name: deploy
    needs: [meta, quality-gate]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read  # pull the verified images (#43)
    steps:
      - name: Deploy to kind
        run: 'echo "stub: verify again, create the kind cluster and apply the manifests in #43"'

  # ---------------------------------------------------------------------------------------------
  # Evidence of every run (#44): run log, SAST, SBOM, SCA, secrets and signing reports.
  # Runs also when an earlier job failed, because a blocked run is evidence too. Committing to
  # main needs a way around the branch ruleset (evidence branch or app token), decided in #44.
  # ---------------------------------------------------------------------------------------------
  evidence:
    name: evidence
    needs: [meta, sbom, sast, sca, secrets, build, sign, quality-gate, deploy]
    if: ${{ always() && github.event_name != 'pull_request' && needs.meta.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # commit the evidence reports (#44)
    steps:
      - name: Collect and commit the reports
        run: 'echo "stub: collect the reports into evidence/<image>/ and commit them in #44"'
