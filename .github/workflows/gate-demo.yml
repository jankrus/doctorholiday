# Demonstration of the quality gate (issue #36, evidence for #44). Started by hand
# (Actions -> gate-demo -> Run workflow, or `gh workflow run gate-demo.yml -f scenario=secret`).
#
# One fault is put into a throw-away checkout of the run (scripts/gate-demo.sh), then the real scans
# and the real gate (scripts/quality_gate.py) run on it. The gate must block for exactly that reason;
# a blocked run is a RED run on purpose: it is the evidence that the gate works. The scenario `clean`
# is the control and must pass. Nothing is built, signed, pushed or deployed, and the fault is never
# committed to the repository. The reports go to the `evidence` branch like those of a release run,
# under the prefix demo-<scenario>-<run number>.
name: gate-demo

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Fault to put in: clean (control), secret, vulnerability or unsigned"
        type: choice
        required: true
        default: clean
        options:
          - clean
          - secret
          - vulnerability
          - unsigned

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  demo:
    name: gate demo (${{ inputs.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A second start of the same scenario waits instead of running in parallel.
    concurrency:
      group: gate-demo-${{ inputs.scenario }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read  # read the signatures and scan the images in GHCR
    steps:
      # The full history, so that Gitleaks sees the commit that the demo adds.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The digests of the latest signed images come from the evidence branch (written by the
      # evidence job of the last release run).
      - name: Check out the evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: evidence
          path: evidence-src
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | cosign login ghcr.io --username "$ACTOR" --password-stdin

      - name: Put the fault in
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: scripts/gate-demo.sh prepare "$SCENARIO"

      - name: Scans
        run: |
          scripts/scan.sh sast
          scripts/scan.sh sca
          scripts/scan.sh secrets
          scripts/scan.sh image backend
          scripts/scan.sh image frontend
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Last changes before the gate
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: scripts/gate-demo.sh finalize "$SCENARIO"

      # Fails on purpose in every scenario except `clean`.
      - name: Quality gate
        id: gate
        run: python3 scripts/quality_gate.py | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"

      - name: Check that the gate decided as expected
        if: ${{ !cancelled() && (steps.gate.outcome == 'success' || steps.gate.outcome == 'failure') }}
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: scripts/gate-demo.sh assert "$SCENARIO" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the gate reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate
          path: reports/gate/
          if-no-files-found: warn
          retention-days: 90

  evidence:
    name: evidence (${{ inputs.scenario }})
    needs: [demo]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The same group as the evidence job of the pipeline: one push to the evidence branch at a time.
    concurrency:
      group: evidence
      cancel-in-progress: false
    permissions:
      contents: write  # push the evidence branch
      actions: read  # download the artifact and the job log of this run
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the gate reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: gate
          path: artifacts/gate

      - name: Collect the reports of this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          mkdir -p artifacts/run-logs
          scripts/fetch-run-logs.sh "$REPO" "$RUN_ID" artifacts/run-logs
          scripts/collect-evidence.sh artifacts evidence-out "demo-$SCENARIO-$(printf '%05d' "$RUN_NUMBER")"

      - name: Publish to the evidence branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          SCENARIO: ${{ inputs.scenario }}
        run: scripts/publish-evidence.sh "$REPO" evidence-out "evidence gate demo $SCENARIO run $RUN_NUMBER"
