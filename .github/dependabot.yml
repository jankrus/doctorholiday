# Automated dependency updates (#46). One weekly update PR per ecosystem and component; minor and
# patch versions are grouped, major versions come as separate PRs. Update PRs run the scan jobs of
# the pipeline (pull_request trigger); they never deploy or sign (only runs on main are release runs).
# Dependabot rewrites lockfiles together with the manifest (uv.lock, package-lock.json), keeps the
# `@sha256:` digest of Docker base images and the `# vX.Y.Z` comment of SHA-pinned actions in sync.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    # uv 0.13 and later breaks required-version in backend/pyproject.toml; the Docker image and
    # setup-uv stay on 0.12.x, so the build backend range is not widened either.
    ignore:
      - dependency-name: uv-build
        versions: [">=0.13"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    # The project runs on Node 22 (frontend/.nvmrc, AGENTS.md); @types/node must match it.
    # The other entries are major versions whose update PRs failed `npm ci` or the tests because
    # they need a coordinated upgrade of the toolchain. They are not forgotten: each is its own
    # task (see `.github/workflows/README.md`, "Ignored major versions"), and the ignore is lifted
    # when that task is done.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23"]
      # React 19 (needs the React upgrade with its type packages and the router together).
      - dependency-name: react
        versions: [">=19"]
      - dependency-name: react-dom
        versions: [">=19"]
      - dependency-name: "@types/react"
        versions: [">=19"]
      - dependency-name: "@types/react-dom"
        versions: [">=19"]
      # react-router 8: its peer dependencies do not resolve with React 18 and @types/react 18.
      - dependency-name: react-router
        versions: [">=8"]
      # ESLint 9 and later use flat config; eslint, @eslint/js and the React hooks plugin (7.x needs
      # ESLint 9) move together with the migration of the lint configuration.
      - dependency-name: eslint
        versions: [">=9"]
      - dependency-name: "@eslint/js"
        versions: [">=9"]
      - dependency-name: eslint-plugin-react-hooks
        versions: [">=6"]
      # jsdom 30 and later need Node 22.14 (the pin is 22.13.1).
      - dependency-name: jsdom
        versions: [">=30"]
      # TypeScript 7 (the native port) conflicts with the peer ranges of openapi-typescript and others.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # Pins fixed elsewhere: requires-python >=3.12,<3.13 and backend/.python-version (D-03 in
    # docs/report/deviations.md), required-version >=0.12.23,<0.13 in backend/pyproject.toml.
    ignore:
      - dependency-name: python
        versions: [">=3.13"]
      - dependency-name: astral-sh/uv
        versions: [">=0.13"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    # Node 22 is fixed in frontend/.nvmrc and AGENTS.md.
    ignore:
      - dependency-name: node
        versions: [">=23"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
