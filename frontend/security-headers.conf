# Security headers for every static response (included by nginx.conf, issue #28).
# add_header is not inherited into a location that sets its own add_header, so this file is
# included in each location. The Content-Security-Policy is added in #27.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
