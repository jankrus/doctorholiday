# Security headers for every static response (included by nginx.conf, issue #28).
# add_header is not inherited into a location that sets its own add_header, so this file is
# included in each location. The Content-Security-Policy (#27) allows only the app's own origin: no inline
# or eval'd script (script-src 'self'), no plugins, no framing, and forms and links only to itself.
# style-src 'self' is enough because the build emits CSS files and React sets styles through the CSSOM,
# which a CSP does not block. Tested in src/securityHeaders.test.ts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
