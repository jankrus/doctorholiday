# nginx for the Doctor Holiday SPA (issue #28). Used with nginxinc/nginx-unprivileged.
#
# Runs as the non-root user of that image on port 8080 with a read-only root filesystem: the pid
# file and all temporary files live in /tmp (an emptyDir in Kubernetes, #38). Logs go to the
# container streams. The API is not served here: ingress-nginx routes /api to the backend (#40).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    # Temporary paths on /tmp, because the rest of the filesystem is read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Static files only: small limits are enough and reduce what a slow client can hold open.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Only GET and HEAD make sense for static files.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Kubernetes liveness and readiness probe (#38). Status word only.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Vite emits content-hashed file names, so they can be cached for good.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Single-page app: unknown paths get index.html (routing happens in the browser).
        # The entry document is never cached so a new release is picked up at once.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
