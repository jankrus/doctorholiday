# Non-secret configuration of the backend (issue #38). Secrets (DATABASE_URL, MFA_ENCRYPTION_KEY,
# SESSION_SECRET) are NOT here: `make secrets` creates them at deploy time (#30).
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: doctorholiday
data:
  # The only browser origin that may call the API: the ingress host (#40). Same origin as the
  # frontend, so CORS is not used in practice; the backend still needs at least one origin.
  ALLOWED_ORIGINS: https://doctorholiday.localhost
  LOG_LEVEL: INFO
  PORT: "8080"
