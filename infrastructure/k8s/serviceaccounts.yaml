# One ServiceAccount per workload (issue #37, brief §4b). None of the pods talks to the Kubernetes
# API, so none of them needs a token or a permission:
#   - `automountServiceAccountToken: false` here and again in every pod spec, so a stolen pod
#     cannot ask the API server anything;
#   - there is no Role, ClusterRole or binding anywhere in this directory. A ServiceAccount without
#     binding has only the rights every authenticated identity has (discovery, self-review).
#
# `postgres` and `db-migrate` are separate accounts although they use the same image: they will
# get different (still empty) rights if one of them ever needs one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: doctorholiday
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: doctorholiday
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: doctorholiday
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migrate
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: doctorholiday
automountServiceAccountToken: false
