# NetworkPolicies (issue #41, brief §4d): everything is denied, then exactly the flows of the
# architecture are allowed (docs/architecture/architecture.md, flows F2 to F4):
#
#   ingress-nginx ──8080──▶ frontend
#   ingress-nginx ──8080──▶ backend
#   backend       ──5432──▶ postgres
#   db-migrate    ──5432──▶ postgres
#   every pod     ──53────▶ kube-dns            (name resolution only)
#
# Nothing else: no pod may reach the internet (the backend needs none), the frontend cannot reach
# the database, and an unknown pod in the namespace can reach nothing and be reached by nothing.
#
# Policies only take effect with a CNI that enforces them. kind's default (kindnet) does not, so
# the cluster uses Calico (infrastructure/kind/kind-config.yaml, `make cni`).
# Probes from the kubelet come from the node itself and are always allowed by Calico.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels:
    app.kubernetes.io/part-of: doctorholiday
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  labels:
    app.kubernetes.io/part-of: doctorholiday
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-allow-ingress-controller
  labels:
    app.kubernetes.io/part-of: doctorholiday
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-ingress-controller
  labels:
    app.kubernetes.io/part-of: doctorholiday
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow-egress-postgres
  labels:
    app.kubernetes.io/part-of: doctorholiday
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-migrate-allow-egress-postgres
  labels:
    app.kubernetes.io/part-of: doctorholiday
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: db-migrate
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-backend-and-migrate
  labels:
    app.kubernetes.io/part-of: doctorholiday
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: db-migrate
      ports:
        - protocol: TCP
          port: 5432
