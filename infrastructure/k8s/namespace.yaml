# Namespace of the application (issue #37, brief §4a). Everything of Doctor Holiday lives here and
# nowhere else; the ingress controller (Traefik) runs in its own namespace.
#
# Pod Security Admission: the `restricted` profile is the strictest built-in one. It rejects a pod
# that runs as root, may escalate privileges, keeps capabilities or has no seccomp profile, so the
# security context of the brief (§4c) is enforced by the cluster, not only written down in the
# manifests. `audit` and `warn` use the same level, so a violation also shows in the API server's
# audit log and as a warning on `kubectl apply`.
apiVersion: v1
kind: Namespace
metadata:
  name: doctorholiday
  labels:
    app.kubernetes.io/part-of: doctorholiday
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
