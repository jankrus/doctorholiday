# Database migrations as a one-off Job (issues #39, #12). It runs infrastructure/postgres/migrate.sh
# with the migrations from backend/migrations, as the schema owner `doctorholiday_owner`. The
# backend itself never runs migrations and its application role cannot change the schema.
#
# The script applies every file exactly once and refuses a changed migration, so running the Job
# again is safe. `make deploy` deletes a finished Job first (a Job's pod template is immutable) and
# waits for the new one before the backend is rolled out.
#
# Same image as the database (it contains `psql`); same restricted security context.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: doctorholiday
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/part-of: doctorholiday
    spec:
      serviceAccountName: db-migrate
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: postgres:16.15-alpine3.24@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          # Wait until the database accepts connections (it may still run its first-start init).
          args:
            - |
              until pg_isready --host=postgres --port=5432 --dbname=doctorholiday --username=doctorholiday_owner; do
                echo "waiting for the database"
                sleep 2
              done
              exec /bin/sh /opt/migrate/migrate.sh
          env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: doctorholiday
            - name: PGUSER
              value: doctorholiday_owner
            # The password is read from a file, never from an environment variable.
            - name: PGPASSWORD_FILE
              value: /run/secrets/db_owner_password
            - name: MIGRATIONS_DIR
              value: /migrations
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: script
              mountPath: /opt/migrate
              readOnly: true
            - name: migrations
              mountPath: /migrations
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: script
          configMap:
            name: db-migrate-script
            defaultMode: 0555
        - name: migrations
          configMap:
            name: db-migrations
        # Only the owner password, not the superuser's and not the application's.
        - name: secrets
          secret:
            secretName: db-credentials
            defaultMode: 0440
            items:
              - key: db_owner_password
                path: db_owner_password
