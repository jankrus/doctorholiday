[project]
name = "doctorholiday-backend"
# Image tags come from VERSION.txt (repo root); this version only names the Python package.
version = "0.1.0"
description = "Doctor Holiday REST API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Everyone (developers, CI, Docker build) uses the same uv minor version, see ADR-002.
required-version = ">=0.12.23,<0.13"

[tool.uv.build-backend]
module-name = "doctorholiday"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PT", "DTZ", "LOG", "G", "T20", "BLE",
    "S",  # flake8-bandit: security checks
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, dummy secret sentinels, and start the app as a subprocess.
"tests/**" = ["S101", "S105", "S106", "S310", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
